[project]
name = "cv-agent"
version = "0.1.0"
description = "Agent that answers questions about Alejandro Heredia's CV"
requires-python = ">=3.12,<3.15"
dependencies = [
    "mistralai-agents>=1.1.2,<1.2",
]

[tool.mistralai.agents]
entrypoint = "main:agent"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
bypass-selection = true
